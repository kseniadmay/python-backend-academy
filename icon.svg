<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Radial Base (Evening Obsidian) -->
    <radialGradient id="obsidian-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#121620"/>
      <stop offset="60%" stop-color="#090c12"/>
      <stop offset="100%" stop-color="#040508"/>
    </radialGradient>

    <!-- Noble Ambient Glow Orbs (Deep Imperial Emerald top-left, Grand Cru Burgundy bottom-right) -->
    <radialGradient id="orb-emerald" cx="20%" cy="18%" r="56%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.40"/>
      <stop offset="50%" stop-color="#047857" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-burgundy" cx="80%" cy="82%" r="56%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#881337" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0"/>
    </radialGradient>

    <!-- Specular Glass Bevel Rim (Micro-crystal rim) -->
    <linearGradient id="glass-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.58)"/>
      <stop offset="35%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="70%" stop-color="rgba(136,19,55,0.25)"/>
      <stop offset="100%" stop-color="rgba(5,150,105,0.35)"/>
    </linearGradient>

    <!-- Noble Imperial Emerald Serpent Gradient (Deep Mineral Tourmaline) -->
    <linearGradient id="snake-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="28%" stop-color="#059669"/>
      <stop offset="72%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Noble Grand Cru Burgundy Serpent Gradient (Vintage Velvet Bordeaux) -->
    <linearGradient id="snake-burgundy" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="28%" stop-color="#be123c"/>
      <stop offset="68%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#3b0714"/>
    </linearGradient>

    <!-- Subsurface Bounce Light Cross-Reflections -->
    <linearGradient id="bounce-burgundy-on-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="bounce-emerald-on-burgundy" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Specular Ridge Crest Highlights -->
    <linearGradient id="specular-crest-upper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="specular-crest-lower" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.50)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Elevation Drop Shadow for 3D Levitation -->
    <filter id="shadow-snake" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- Starlight Sparkle Glow Filter -->
    <filter id="glow-sparkle" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle (Evening Obsidian) -->
  <rect width="512" height="512" rx="116" fill="url(#obsidian-bg)"/>

  <!-- Backend Architecture Subtle Dot Matrix (Data Bus Layer, opacity 0.045) -->
  <g fill="rgba(255,255,255,0.045)">
    <circle cx="76" cy="76" r="2.6"/><circle cx="166" cy="76" r="2.6"/><circle cx="256" cy="76" r="2.6"/><circle cx="346" cy="76" r="2.6"/><circle cx="436" cy="76" r="2.6"/>
    <circle cx="76" cy="166" r="2.6"/><circle cx="166" cy="166" r="2.6"/><circle cx="256" cy="166" r="2.6"/><circle cx="346" cy="166" r="2.6"/><circle cx="436" cy="166" r="2.6"/>
    <circle cx="76" cy="256" r="2.6"/><circle cx="166" cy="256" r="2.6"/><circle cx="256" cy="256" r="2.6"/><circle cx="346" cy="256" r="2.6"/><circle cx="436" cy="256" r="2.6"/>
    <circle cx="76" cy="346" r="2.6"/><circle cx="166" cy="346" r="2.6"/><circle cx="256" cy="346" r="2.6"/><circle cx="346" cy="346" r="2.6"/><circle cx="436" cy="346" r="2.6"/>
    <circle cx="76" cy="436" r="2.6"/><circle cx="166" cy="436" r="2.6"/><circle cx="256" cy="436" r="2.6"/><circle cx="346" cy="436" r="2.6"/><circle cx="436" cy="436" r="2.6"/>
  </g>

  <!-- Noble Ambient Glow Orbs -->
  <rect width="512" height="512" rx="116" fill="url(#orb-emerald)"/>
  <rect width="512" height="512" rx="116" fill="url(#orb-burgundy)"/>

  <!-- Specular Glass Bevel Rim -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#glass-rim)" stroke-width="3"/>

  <!-- Canonical Python Emblem (Centered at 256, 256, scale 2.5, tx=118.5, ty=118.5) -->
  <g transform="translate(118.5, 118.5) scale(2.5)">
    <!-- ================= UPPER NOBLE EMERALD SERPENT ================= -->
    <path fill="url(#snake-emerald)"
          filter="url(#shadow-snake)"
          d="M55.023-0.077c-25.971,0-26.25,10.081-26.25,12.156c0,3.148,0,12.594,0,12.594h26.75v3.781 c0,0-27.852,0-37.375,0c-7.949,0-17.938,4.833-17.938,26.25c0,19.673,7.792,27.281,15.656,27.281c2.335,0,9.344,0,9.344,0 s0-9.765,0-13.125c0-5.491,2.721-15.656,15.406-15.656c15.91,0,19.971,0,26.531,0c3.902,0,14.906-1.696,14.906-14.406 c0-13.452,0-17.89,0-24.219C82.054,11.426,81.515-0.077,55.023-0.077z"/>

    <!-- Burgundy Subsurface Bounce Reflection on Upper Snake Underbelly -->
    <path fill="none"
          stroke="url(#bounce-burgundy-on-emerald)"
          stroke-width="3"
          opacity="0.55"
          d="M17.8 28.5 c-6.8 0-14.5 4.1-14.5 22.8 c0 16 6 22.5 12.3 22.5 h13.2 v-10.4 c0-4.4 2.1-12.5 12.3-12.5 h21.2"/>

    <!-- Specular Ridge Crest (3D Glass Facet Line) -->
    <path fill="url(#specular-crest-upper)"
          d="M54.2 2.2c-23.5 0-23.7 9-23.7 10.9v10.5h23.5v3.2H17.8c-6.8 0-14.5 4.1-14.5 22.8c4.2-12.8 14.8-17.6 24.2-17.6h27.8c5.2 0 13.8-2.6 13.8-12.2c0-10.4 0-14.2 0-19.8C79.1 11.2 78.4 2.2 54.2 2.2z"/>

    <!-- Emerald Eye Bed (Deep Midnight Jade) -->
    <circle cx="40.27" cy="13.2" r="5.8" fill="#022c22"/>
    <!-- Curved Sparkle Glyph ✨ (Upper Eye) -->
    <g transform="translate(40.27, 13.2)" filter="url(#glow-sparkle)">
      <path d="M 0,-7.2 Q 0,0 7.2,0 Q 0,0 0,7.2 Q 0,0 -7.2,0 Q 0,0 0,-7.2 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="1.6" fill="#ecfdf5"/>
    </g>

    <!-- ================= LOWER NOBLE GRAND CRU BURGUNDY SERPENT ================= -->
    <path fill="url(#snake-burgundy)"
          filter="url(#shadow-snake)"
          d="M55.397,109.923c25.959,0,26.282-10.271,26.282-12.156c0-3.148,0-12.594,0-12.594H54.897v-3.781 c0,0,28.032,0,37.375,0c8.009,0,17.938-4.954,17.938-26.25c0-23.322-10.538-27.281-15.656-27.281c-2.336,0-9.344,0-9.344,0 s0,10.216,0,13.125c0,5.491-2.631,15.656-15.406,15.656c-15.91,0-19.476,0-26.532,0c-3.892,0-14.906,1.896-14.906,14.406 c0,14.475,0,18.265,0,24.219C28.366,100.497,31.562,109.923,55.397,109.923z"/>

    <!-- Emerald Subsurface Bounce Reflection on Lower Snake Upper Crease -->
    <path fill="none"
          stroke="url(#bounce-emerald-on-burgundy)"
          stroke-width="3"
          opacity="0.55"
          d="M92.2 81.3 c6.8 0 14.5-4.1 14.5-22.8 c0-16-6-22.5-12.3-22.5 H81.2 v10.4 c0 4.4-2.1 12.5-12.3 12.5 H47.7"/>

    <!-- Specular Ridge Crest (3D Glass Facet Line) -->
    <path fill="url(#specular-crest-lower)"
          d="M56.2 107.6c23.5 0 23.7-9 23.7-10.9V86.2H56.4v-3.2h36.2c6.8 0 14.5-4.1 14.5-22.8c-4.2 12.8-14.8 17.6-24.2 17.6H60.1c-5.2 0-13.8 2.6-13.8 12.2c0 10.4 0 14.2 0 19.8C46.3 98.6 47 107.6 56.2 107.6z"/>

    <!-- Burgundy Eye Bed (Deep Vintage Garnet) -->
    <circle cx="70.15" cy="96.64" r="5.8" fill="#3b0714"/>
    <!-- Curved Sparkle Glyph ✨ (Lower Eye) -->
    <g transform="translate(70.15, 96.64)" filter="url(#glow-sparkle)">
      <path d="M 0,-7.2 Q 0,0 7.2,0 Q 0,0 0,7.2 Q 0,0 -7.2,0 Q 0,0 0,-7.2 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="1.6" fill="#fff1f2"/>
    </g>
  </g>
</svg>

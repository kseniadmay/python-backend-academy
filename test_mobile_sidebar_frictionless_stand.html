<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Стенд мобильного сайдбара (Mobile Drawer): Минимальное трение и пиковая мотивация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Onest:wght@400;500;600;700;800;900&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #0b0f14;
      --bg-subtle: #12171f;
      --paper: #14160F;
      --surface: #181b14;
      --surface-2: #20241b;
      --surface-3: #282d22;
      --surface-hover: rgba(255, 255, 255, 0.06);
      --ink: #f0f2e8;
      --ink-soft: #b8baa9;
      --ink-muted: #7d806f;
      --line: #2e3325;
      --line-soft: #23271c;
      --moss: #74AC82;
      --moss-deep: #CDE8D2;
      --moss-soft: #223028;
      --emerald: #10B981;
      --emerald-glow: rgba(16, 185, 129, 0.25);
      --amber: #F59E0B;
      --amber-glow: rgba(245, 158, 11, 0.2);
      --clay: #DA9C63;
      --frost: #38BDF8;
      --frost-soft: rgba(56, 189, 248, 0.15);
      --border-glass: rgba(255, 255, 255, 0.08);
      --font-d: 'Onest', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-m: 'JetBrains Mono', monospace;
      --font-title: 'Unbounded', sans-serif;
      --spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="light"] {
      --bg-canvas: #f4f6f8;
      --bg-subtle: #ffffff;
      --paper: #F1F2EC;
      --surface: #ffffff;
      --surface-2: #F5F6F0;
      --surface-3: #ECEEE4;
      --surface-hover: rgba(0, 0, 0, 0.04);
      --ink: #191c18;
      --ink-soft: #565a4e;
      --ink-muted: #8c8f82;
      --line: #e2e4d8;
      --line-soft: #ebeee0;
      --moss: #356641;
      --moss-deep: #20442a;
      --moss-soft: #e2ede5;
      --emerald: #059669;
      --emerald-glow: rgba(5, 150, 105, 0.15);
      --amber: #d97706;
      --amber-glow: rgba(217, 119, 6, 0.15);
      --clay: #b8703b;
      --frost: #0284c7;
      --frost-soft: rgba(2, 132, 199, 0.12);
      --border-glass: rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-canvas);
      color: var(--ink);
      font-family: var(--font-d);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.14;
    }
    .orb-1 { width: 500px; height: 500px; background: #10B981; top: -150px; left: 10%; }
    .orb-2 { width: 450px; height: 450px; background: #38BDF8; bottom: -100px; right: 5%; }

    /* Top Showcase Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(24, 27, 20, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    [data-theme="light"] .top-bar {
      background: rgba(255, 255, 255, 0.9);
    }
    .top-bar__left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .badge-pill-mobile {
      font-family: var(--font-m);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--frost);
      border: 1px solid rgba(56, 189, 248, 0.3);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .top-bar__title {
      font-family: var(--font-title);
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--ink);
    }
    .top-bar__controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .variant-tabs {
      display: flex;
      background: var(--surface-2);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--line);
      gap: 4px;
    }
    .variant-tab {
      background: transparent;
      border: none;
      color: var(--ink-soft);
      padding: 6px 14px;
      border-radius: 8px;
      font-family: var(--font-d);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--spring);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .variant-tab:hover {
      color: var(--ink);
      background: var(--surface-hover);
    }
    .variant-tab.active {
      background: var(--surface-3);
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      border: 1px solid var(--line);
    }
    .btn-icon-switch {
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--ink);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    /* Showcase Layout */
    .showcase-layout {
      flex: 1;
      display: flex;
      padding: 24px 32px;
      gap: 36px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      align-items: flex-start;
    }

    /* Mobile Device Frame (iPhone 15 Pro Ratio: 380px x 780px) */
    .mobile-phone-frame {
      width: 380px;
      height: 780px;
      background: #000;
      border-radius: 48px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 0 10px #1f232b;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island */
    .phone-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 9999;
    }

    /* Screen Viewport */
    .phone-screen {
      flex: 1;
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding-top: 40px;
    }

    /* Mobile Topbar */
    .m-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      z-index: 10;
    }
    .m-topbar-brand {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .m-pomo-pill {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px 8px;
      font-family: var(--font-m);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .m-drawer-btn {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
    }

    /* Mock Mobile Content (Background underneath drawer) */
    .m-body-preview {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0.8;
    }
    .m-card-mock {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      height: 90px;
    }

    /* Bottom Tabbar */
    .m-tabbar {
      background: var(--surface);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 8px 12px calc(8px + 10px);
      z-index: 10;
    }
    .m-tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--ink-muted);
      cursor: pointer;
    }
    .m-tab-item.active {
      color: var(--emerald);
    }

    /* =========================================================
       MOBILE SIDE DRAWER OVERLAY
       ========================================================= */
    .m-drawer-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 50;
      display: flex;
      align-items: stretch;
      justify-content: flex-start;
      transition: opacity 0.25s ease;
    }
    .m-drawer-overlay.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .m-drawer-panel {
      width: 310px;
      max-width: 85%;
      height: 100%;
      background: var(--surface);
      border-right: 1px solid var(--line);
      box-shadow: 12px 0 36px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px 14px 20px;
      transition: transform 0.28s var(--spring);
      transform: translateX(0);
    }
    .m-drawer-overlay.is-hidden .m-drawer-panel {
      transform: translateX(-100%);
    }

    /* Drawer Header */
    .m-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line-soft);
      margin-bottom: 12px;
    }
    .m-drawer-brand-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
    }
    .m-brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: white;
      font-family: var(--font-title);
      font-size: 0.9rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .m-close-btn {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      cursor: pointer;
      font-size: 1rem;
    }

    /* Drawer Hero Action Card (Ergonomic for Thumb) */
    .m-hero-card {
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.16) 0%, rgba(32, 36, 27, 0.75) 100%);
      border: 1px solid rgba(16, 185, 129, 0.38);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s var(--spring);
    }
    .m-hero-card:active {
      transform: scale(0.98);
    }
    .m-hero-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .m-hero-step {
      font-family: var(--font-m);
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--emerald);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .m-hero-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 6px var(--emerald);
      animation: pulseAnim 2s infinite;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
    }
    .m-hero-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.25;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .m-hero-btn {
      width: 100%;
      background: var(--emerald);
      color: #0b150f;
      border: none;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Nav Links in Drawer */
    .m-drawer-nav-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 10px;
    }
    .m-group-title {
      font-family: var(--font-m);
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
      padding: 4px 6px;
    }
    .m-nav-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s;
    }
    .m-nav-link:active {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.35);
      color: var(--emerald);
    }
    .m-nav-link.active {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.3);
      color: var(--emerald);
    }
    .m-nav-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .m-nav-sublist {
      margin-left: 20px;
      padding-left: 6px;
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 2px;
      margin-bottom: 4px;
    }
    .m-nav-subitem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      font-size: 0.74rem;
      color: var(--ink-muted);
      border-radius: 6px;
    }
    .m-nav-subitem.active {
      color: var(--emerald);
      font-weight: 600;
    }

    /* Drawer Footer */
    .m-drawer-foot {
      margin-top: auto;
      border-top: 1px solid var(--line-soft);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .m-foot-hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .m-cooldown-pill {
      flex: 1;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--frost);
      padding: 5px 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-m);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .m-streak-badge {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.28);
      color: var(--amber);
      padding: 5px 8px;
      border-radius: 8px;
      font-family: var(--font-m);
      font-size: 0.72rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .m-sys-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .m-sys-btn {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 4px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Right Explanation & Side-by-Side Comparison */
    .inspector-panel {
      flex: 1;
      background: var(--surface);
      border-radius: 20px;
      border: 1px solid var(--line);
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }
    .inspector-header {
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
    }
    .inspector-badge {
      display: inline-block;
      font-family: var(--font-m);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--frost);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .inspector-title {
      font-family: var(--font-title);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .inspector-desc {
      color: var(--ink-soft);
      font-size: 0.94rem;
      line-height: 1.55;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 10px;
    }
    .matrix-card {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .matrix-card__icon {
      font-size: 1.5rem;
    }
    .matrix-card__title {
      font-family: var(--font-d);
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--ink);
    }
    .matrix-card__text {
      font-size: 0.82rem;
      color: var(--ink-soft);
      line-height: 1.45;
    }
    .matrix-card__score {
      font-family: var(--font-m);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      align-self: flex-start;
      margin-top: auto;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald);
    }

    .action-summary-box {
      background: var(--surface-2);
      border-left: 4px solid var(--frost);
      border-radius: 0 12px 12px 0;
      padding: 16px 20px;
      margin-top: auto;
    }
    .action-summary-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--ink);
      margin-bottom: 4px;
    }
    .action-summary-sub {
      font-size: 0.85rem;
      color: var(--ink-soft);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="ambient-glow orb-1"></div>
  <div class="ambient-glow orb-2"></div>

  <!-- Top Showcase Bar -->
  <header class="top-bar">
    <div class="top-bar__left">
      <span class="badge-pill-mobile">Мобильный сайдбар (Drawer)</span>
      <h1 class="top-bar__title">Адаптация для мобильных устройств</h1>
    </div>

    <div class="top-bar__controls">
      <div class="variant-tabs">
        <button class="variant-tab active" onclick="switchDrawerMode('new')">
          <span>✨ Новый эталонный Drawer</span>
        </button>
        <button class="variant-tab" onclick="switchDrawerMode('old')">
          <span>🕰️ Старый Drawer (Для сравнения)</span>
        </button>
      </div>
      <button class="btn-icon-switch" id="theme-btn" onclick="toggleTheme()" title="Переключить тему">🌙</button>
    </div>
  </header>

  <!-- Main Showcase Layout -->
  <main class="showcase-layout">
    
    <!-- INTERACTIVE PHONE MOCKUP -->
    <div class="mobile-phone-frame">
      <div class="phone-island"></div>

      <div class="phone-screen">
        <!-- Topbar with Hamburger button -->
        <header class="m-topbar">
          <div class="m-topbar-brand">
            <svg style="width:18px;height:18px;stroke:var(--emerald);fill:none;stroke-width:2;" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7.8 7.6 10.5 16M16.2 7.6 13.5 16M8.3 6h7.4"/></svg>
            <span>Academy</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="m-pomo-pill">⏱ 15:00</div>
            <button class="m-drawer-btn" onclick="toggleDrawer()" title="Открыть боковое меню">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
            </button>
          </div>
        </header>

        <!-- Dummy page content -->
        <div class="m-body-preview">
          <div class="m-card-mock"></div>
          <div class="m-card-mock"></div>
          <div class="m-card-mock"></div>
        </div>

        <!-- Mobile Bottom Tabbar -->
        <nav class="m-tabbar">
          <div class="m-tab-item active">
            <span>🗺️</span>
            <span>Путь</span>
          </div>
          <div class="m-tab-item">
            <span>🗂️</span>
            <span>Карточки</span>
          </div>
          <div class="m-tab-item">
            <span>⚡</span>
            <span>IDE</span>
          </div>
        </nav>

        <!-- LIVE DRAWER OVERLAY -->
        <div class="m-drawer-overlay" id="drawer-overlay" onclick="onOverlayClick(event)">
          <aside class="m-drawer-panel" id="drawer-panel-content">
            <!-- Injected dynamically via JS based on 'new' or 'old' mode -->

    function switchDrawerMode(mode) {
      drawerMode = mode;
      const data = CONTENT_DATA[mode];

      document.querySelectorAll('.variant-tab').forEach((tab, idx) => {
        tab.classList.toggle('active', (mode === 'new' && idx === 0) || (mode === 'old' && idx === 1));
      });

      document.getElementById('drawer-panel-content').innerHTML = data.drawerHtml;

      const cardsHtml = data.cards.map(c => `
        <div class="matrix-card">
          <div class="matrix-card__icon">${c.icon}</div>
          <div class="matrix-card__title">${c.title}</div>
          <div class="matrix-card__text">${c.text}</div>
          <div class="matrix-card__score" style="${mode === 'old' ? 'background:rgba(239,68,68,0.15);color:#ef4444;' : ''}">${c.score}</div>
        </div>
      `).join('');

      document.getElementById('inspector-panel').innerHTML = `
        <div class="inspector-header">
          <span class="inspector-badge">${data.badge}</span>
          <h2 class="inspector-title">${data.title}</h2>
          <p class="inspector-desc">${data.desc}</p>
        </div>

        <div class="matrix-grid">
          ${cardsHtml}
        </div>

        <div class="action-summary-box">
          <div class="action-summary-title">${data.summaryTitle}</div>
          <div class="action-summary-sub">${data.summarySub}</div>
        </div>
      `;
    }

    function toggleDrawer() {
      const overlay = document.getElementById('drawer-overlay');
      isDrawerOpen = !isDrawerOpen;
      overlay.classList.toggle('is-hidden', !isDrawerOpen);
    }

    function onOverlayClick(e) {
      if (e.target.id === 'drawer-overlay') {
        toggleDrawer();
      }
    }

    function simulateMobileCooldown() {
      isCooldownDone = !isCooldownDone;
      const pill = document.getElementById('m-cd-pill');
      const label = document.getElementById('m-cd-label');
      if (isCooldownDone) {
        pill.style.background = 'rgba(16, 185, 129, 0.15)';
        pill.style.borderColor = 'rgba(16, 185, 129, 0.35)';
        pill.style.color = 'var(--emerald)';
        label.textContent = '🌿 Остывание: 100%';
      } else {
        pill.style.background = 'rgba(56, 189, 248, 0.12)';
        pill.style.borderColor = 'rgba(56, 189, 248, 0.3)';
        pill.style.color = 'var(--frost)';
        label.textContent = '❄️ Остывание: 2м';
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const cur = html.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      document.getElementById('theme-btn').textContent = next === 'dark' ? '🌙' : '☀️';
    }

    function toggleLang(btn) {
      btn.textContent = btn.textContent === 'RU' ? 'EN' : 'RU';
    }

    // Init
    switchDrawerMode('new');
  </script>
</body>
</html>

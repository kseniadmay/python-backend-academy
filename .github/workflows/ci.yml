name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verification Pipeline (100% Pass)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Regression Bug Suite (80/80) & Canonical Benchmarks
        run: node tests/test_bugs_regression.js

      - name: Run Verification Pipeline (RemNote + PWA + Headless Chrome)
        run: python verify_all.py --quick

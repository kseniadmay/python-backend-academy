name: CI/CD Pipeline & Deploy to zetalink

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verification Pipeline (100% Pass)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Regression Bug Suite (80/80) & Canonical Benchmarks
        run: node tests/test_bugs_regression.js

      - name: Run Verification Pipeline (RemNote + PWA + Headless Chrome)
        run: python verify_all.py --quick

  deploy:
    name: Auto Deploy to zetalink VPS
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: SSH Remote Deployment to zetalink
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Начало автоматического деплоя на сервер zetalink..."
            cd /home/fury/python-backend-academy

            echo "📦 Получение свежего кода из GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔄 Перезапуск службы Академии..."
            systemctl --user restart academy.service

            echo "✅ Сервер zetalink успешно обновлён и работает!"

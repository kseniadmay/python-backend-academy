<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Academy — Python Backend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F2EC; --surface:#FBFBF7; --surface-2:#F4F5EE;
    --ink:#1C201A; --ink-soft:#565A4E; --ink-muted:#8B8D80;
    --line:#DCDBCD; --line-soft:#E7E6DA;
    --moss:#3F6B4A; --moss-deep:#274A32; --moss-soft:#E3ECE3;
    --clay:#B8703B; --clay-deep:#7C4A22; --clay-soft:#F3E6D3;
    --locked:#A6A493; --locked-soft:#EAE9DF;
    --danger:#B23A34; --focus:#2E63B8;
    --shadow-1:0 1px 2px rgba(28,32,26,.07),0 1px 1px rgba(28,32,26,.05);
    --font-d:'Unbounded',sans-serif; --font-b:'Golos Text',sans-serif; --font-m:'JetBrains Mono',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14160F; --surface:#1B1E15; --surface-2:#21241A;
      --ink:#ECEDE2; --ink-soft:#B6B8A9; --ink-muted:#7D806F;
      --line:#33362A; --line-soft:#282B20;
      --moss:#74AC82; --moss-deep:#CDE8D2; --moss-soft:#223028;
      --clay:#DA9C63; --clay-deep:#F6DDBB; --clay-soft:#2E2418;
      --locked:#5B5D4E; --locked-soft:#23251C;
      --danger:#E08076;
      --shadow-1:0 1px 3px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --paper:#14160F; --surface:#1B1E15; --surface-2:#21241A;
    --ink:#ECEDE2; --ink-soft:#B6B8A9; --ink-muted:#7D806F;
    --line:#33362A; --line-soft:#282B20;
    --moss:#74AC82; --moss-deep:#CDE8D2; --moss-soft:#223028;
    --clay:#DA9C63; --clay-deep:#F6DDBB; --clay-soft:#2E2418;
    --locked:#5B5D4E; --locked-soft:#23251C;
    --danger:#E08076;
    --shadow-1:0 1px 3px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-b);line-height:1.55;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font-d);margin:0;letter-spacing:-.01em;color:var(--ink);}
  h1{font-weight:700;font-size:clamp(1.5rem,1.2rem + 1.3vw,2.1rem);line-height:1.15;}
  h2{font-weight:600;font-size:1.3rem;line-height:1.25;}
  h3{font-weight:600;font-size:1.02rem;line-height:1.3;}
  p{margin:0 0 .7em;}
  a{color:inherit;}
  button{font-family:inherit;}
  ul{margin:0;padding:0;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px;}
  .meta{font-size:.83rem;color:var(--ink-soft);}
  .muted{color:var(--ink-muted);}
  code,.mono{font-family:var(--font-m);}
  .icon{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.2em;flex:none;}
  .icon-lg{width:1.6em;height:1.6em;}

  /* ---------- shell / layout ---------- */
  #app{min-height:100vh;display:flex;}
  .sidebar{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 18px;position:sticky;top:0;height:100vh;}
  .brand{font-family:var(--font-d);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;margin-bottom:2px;}
  .brand-sub{font-size:.78rem;color:var(--ink-muted);margin-bottom:26px;}
  .navlink{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink-soft);font-weight:500;font-size:.95rem;margin-bottom:2px;transition:background .15s,color .15s;}
  .navlink:hover{background:var(--surface-2);color:var(--ink);}
  .navlink.active{background:var(--moss-soft);color:var(--moss-deep);}
  .sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;}
  .streak-pill{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:.92rem;}
  .streak-pill .icon{color:var(--clay);}
  .icon-btn{background:none;border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);}
  .link-quiet{background:none;border:none;padding:4px 2px;font-size:.8rem;color:var(--ink-muted);text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .link-quiet:hover{color:var(--ink-soft);}

  .shell{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{display:none;position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 18px;align-items:center;justify-content:space-between;}
  main{flex:1;padding:36px 40px 90px;}
  .container{max-width:840px;margin:0 auto;}
  .tabbar{display:none;}

  @media (max-width:880px){
    .sidebar{display:none;}
    .topbar{display:flex;}
    main{padding:20px 16px 96px;}
    .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10;}
    .tabbar__item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--ink-muted);font-size:.72rem;font-weight:500;padding:6px 2px;border-radius:10px;}
    .tabbar__item.active{color:var(--moss-deep);}
  }

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:.95rem;padding:12px 20px;border-radius:13px;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:transform .12s,box-shadow .12s,background .15s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--moss);color:#F7FBF6;}
  .btn-primary:hover{background:var(--moss-deep);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-clay{background:var(--clay);color:#FBF4EC;}
  .btn-clay:hover{background:var(--clay-deep);}
  .btn[disabled]{opacity:.55;cursor:not-allowed;}

  /* ---------- dashboard ---------- */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px;margin-bottom:22px;box-shadow:var(--shadow-1);}
  .hero__eyebrow{color:var(--ink-soft);margin-bottom:4px;}
  .hero__row{display:flex;align-items:flex-end;gap:34px;flex-wrap:wrap;margin:14px 0 18px;}
  .hero__stat-num{font-family:var(--font-d);font-weight:700;font-size:3.1rem;line-height:1;color:var(--moss-deep);}
  .hero__stat-label{font-size:.85rem;color:var(--ink-soft);margin-top:4px;}
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .stat-chip{background:var(--surface-2);border-radius:11px;padding:9px 14px;font-size:.85rem;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .stat-chip b{color:var(--ink);font-family:var(--font-d);font-weight:600;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:18px;}
  .panel h2{margin-bottom:10px;}

  /* ---------- map / stages ---------- */
  .stage{display:flex;gap:18px;align-items:flex-start;}
  .stage__spine{flex:none;width:30px;display:flex;flex-direction:column;align-items:center;position:relative;}
  .stage__dot{width:30px;height:30px;border-radius:50%;background:var(--moss);color:#F7FBF6;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:600;font-size:.85rem;flex:none;z-index:1;}
  .stage:not(:last-child) .stage__spine::after{content:'';position:absolute;top:30px;bottom:-28px;width:2px;background:var(--line);left:50%;transform:translateX(-50%);}
  .stage__body{flex:1;min-width:0;padding-bottom:34px;}
  .stage__title{margin-bottom:3px;}
  .stage__desc{margin-bottom:14px;}
  .node-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}

  .node-card{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:15px;padding:15px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .12s;}
  .node-card:hover{transform:translateY(-1px);}
  .node-card__top{display:flex;justify-content:space-between;align-items:center;}
  .node-card__num{font-family:var(--font-m);font-size:.72rem;color:var(--ink-muted);}
  .node-card__title{font-size:.98rem;}
  .node-card__summary{font-size:.85rem;color:var(--ink-soft);margin:0;}
  .node-card__prereq{font-size:.76rem;color:var(--ink-muted);margin:2px 0 0;}
  .node-card--available{border-color:var(--clay);}
  .node-card--available .node-card__top .icon{color:var(--clay);}
  .node-card--mastered{border-color:var(--moss);background:var(--moss-soft);}
  .node-card--mastered .node-card__top .icon{color:var(--moss-deep);}
  .node-card--locked{opacity:.68;}
  .node-card--locked .node-card__top .icon{color:var(--locked);}
  .node-card--locked:hover{transform:none;}

  /* ---------- topic page ---------- */
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);text-decoration:none;font-size:.9rem;margin-bottom:16px;font-weight:500;}
  .back-link:hover{color:var(--ink);}
  .topic-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-m);font-size:.78rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);margin-bottom:12px;}
  .state-tag{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;padding:5px 12px;border-radius:999px;margin-bottom:16px;}
  .state-tag--available{background:var(--clay-soft);color:var(--clay-deep);}
  .state-tag--mastered{background:var(--moss-soft);color:var(--moss-deep);}
  .state-tag--locked{background:var(--locked-soft);color:var(--ink-soft);}
  .outline-list{list-style:none;margin:10px 0 0;padding:0;}
  .outline-list li{padding:9px 0;border-top:1px solid var(--line-soft);font-size:.94rem;color:var(--ink-soft);display:flex;gap:9px;align-items:flex-start;}
  .outline-list li .icon{margin-top:.15em;color:var(--ink-muted);flex:none;}
  .outline-list a{display:flex;gap:9px;align-items:flex-start;width:100%;text-decoration:none;color:var(--ink);}
  .outline-list a:hover{color:var(--moss-deep);}
  .outline-list a .icon{margin-top:.15em;flex:none;}

  /* ---------- lesson runner ---------- */
  .lesson-theory{font-size:1rem;line-height:1.7;}
  .lesson-theory h4{margin:22px 0 8px;font-family:var(--font-d);font-size:1rem;}
  .lesson-theory p{margin:0 0 14px;}
  .lesson-theory ul{margin:0 0 14px;padding-left:22px;}
  .lesson-theory li{margin-bottom:4px;}
  .lesson-theory pre{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto;margin:0 0 14px;}
  .lesson-theory code{font-family:var(--font-m);font-size:.88rem;}
  .lesson-theory p code, .lesson-theory li code{background:var(--surface-2);padding:1px 5px;border-radius:5px;}
  .lesson-theory table{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:.87rem;}
  .lesson-theory th,.lesson-theory td{border:1px solid var(--line);padding:6px 10px;text-align:left;}
  .lesson-theory th{background:var(--surface-2);font-family:var(--font-d);font-weight:600;}
  .code-editor{width:100%;min-height:170px;font-family:var(--font-m);font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);resize:vertical;line-height:1.5;}
  .hint-box{background:var(--clay-soft);border-radius:12px;padding:12px 16px;margin-top:10px;font-size:.87rem;color:var(--clay-deep);}
  .hint-box pre{font-family:var(--font-m);font-size:.85rem;}
  .result-box--pass,.result-box--fail{border-radius:12px;padding:14px 16px;margin-top:14px;font-size:.88rem;white-space:pre-wrap;font-family:var(--font-m);}
  .result-box--pass{background:var(--moss-soft);color:var(--moss-deep);}
  .result-box--fail{background:var(--clay-soft);color:var(--clay-deep);}
  .prereq-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .prereq-pill{background:var(--surface-2);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:.83rem;cursor:pointer;text-decoration:none;color:var(--ink);}
  .prereq-pill:hover{background:var(--locked-soft);}
  .notice{background:var(--surface-2);border-radius:14px;padding:16px 18px;font-size:.9rem;color:var(--ink-soft);margin-top:20px;}
  .mastery-box{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);}

  /* ---------- sandbox ---------- */
  .sandbox-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  @media (min-width:880px){.sandbox-grid{grid-template-columns:1fr 1fr;}}
  textarea#code-input{width:100%;min-height:220px;font-family:var(--font-m);font-size:.92rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--ink);resize:vertical;line-height:1.5;}
  #code-output{width:100%;min-height:220px;font-family:var(--font-m);font-size:.88rem;background:var(--ink);color:#DCEAD9;border-radius:14px;padding:16px;white-space:pre-wrap;overflow-x:auto;line-height:1.5;margin:0;}

  /* ---------- diagnostic quiz ---------- */
  .quiz-opt{display:block;width:100%;text-align:left;padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:.95rem;color:var(--ink);font-family:inherit;}
  .quiz-opt:hover:not(:disabled){background:var(--surface-2);}
  .quiz-opt:disabled{cursor:default;}
  .quiz-opt--correct{border-color:var(--moss);background:var(--moss-soft);color:var(--moss-deep);font-weight:600;}
  .quiz-opt--wrong{border-color:var(--clay);background:var(--clay-soft);color:var(--clay-deep);font-weight:600;}
  .quiz-progress{height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-bottom:18px;}
  .quiz-progress__bar{height:100%;background:var(--moss);border-radius:99px;transition:width .25s;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div id="app">

  <aside class="sidebar">
    <div class="brand"><svg class="icon icon-lg" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7.8 7.6 10.5 16M16.2 7.6 13.5 16M8.3 6h7.4"/></svg>Academy</div>

    <nav id="nav-desktop">

    <div class="sidebar-foot">
      <div class="streak-pill"><svg class="icon" viewBox="0 0 24 24" id="flame-icon-d"><path d="M12 3c-.5 3-3 4-3 7.5A3.5 3.5 0 0 0 12 14a3.5 3.5 0 0 0 3-5c1.5 1 2 2.7 2 4.2A5 5 0 0 1 12 21a5 5 0 0 1-5-5.2C7 12 9 9 9 7c1 1 1.2 2 1.2 2S11 5 12 3Z"/></svg><span id="streak-num-d">0</span> дней подряд</div>
      <button class="icon-btn" id="theme-toggle-d" aria-label="Переключить тему"></button>

  <div class="shell">
    <header class="topbar">
      <div class="brand" style="font-size:1.02rem;"><svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7.8 7.6 10.5 16M16.2 7.6 13.5 16M8.3 6h7.4"/></svg>Academy</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="streak-pill"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3c-.5 3-3 4-3 7.5A3.5 3.5 0 0 0 12 14a3.5 3.5 0 0 0 3-5c1.5 1 2 2.7 2 4.2A5 5 0 0 1 12 21a5 5 0 0 1-5-5.2C7 12 9 9 9 7c1 1 1.2 2 1.2 2S11 5 12 3Z"/></svg><span id="streak-num-m">0</span></div>
        <button class="icon-btn" id="theme-toggle-m" aria-label="Переключить тему"></button>
      </div>
    </header>

    <main id="view-root"></main>

    <nav class="tabbar">
      <a href="#/" class="tabbar__item" data-route="/"></a>
      <a href="#/map" class="tabbar__item" data-route="/map"></a>
      <a href="#/sandbox" class="tabbar__item" data-route="/sandbox"></a>
    </nav>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= ICONS ================= */
const ICONS = {
  home:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5M6 10v9h5v-5h2v5h5v-9"/></svg>',
  map:'<svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7.8 7.6 10.5 16M16.2 7.6 13.5 16M8.3 6h7.4"/></svg>',
  terminal:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>',
  flame:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 3c-.5 3-3 4-3 7.5A3.5 3.5 0 0 0 12 14a3.5 3.5 0 0 0 3-5c1.5 1 2 2.7 2 4.2A5 5 0 0 1 12 21a5 5 0 0 1-5-5.2C7 12 9 9 9 7c1 1 1.2 2 1.2 2S11 5 12 3Z"/></svg>',
  lock:'<svg class="icon" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>',
  check:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 12.5 9 17.5 20 6.5"/></svg>',
  dot:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/></svg>',
  chevronLeft:'<svg class="icon" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>',
  play:'<svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7Z"/></svg>',
  arrowRight:'<svg class="icon" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
  sun:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>',
  moon:'<svg class="icon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>',
  bullet:'<svg class="icon" viewBox="0 0 24 24" style="width:.5em;height:.5em;"><circle cx="12" cy="12" r="10"/></svg>'
};

/* ================= DATA: skill tree ================= */
const STAGES = [
  {title:'Диагностика', desc:'Калибровка перед стартом — не экзамен.'},
  {title:'Фундамент', desc:'Четыре независимые ветки, можно вести параллельно.'},
  {title:'Backend-разработка', desc:'Здесь появляется первый настоящий сервер.'},
  {title:'Production-навыки', desc:'То, что превращает код в поддерживаемый сервис.'},
  {title:'Проект и трудоустройство', desc:'Финальная сборка и выход на собеседования.'}
];

const NODES = [

      <pre><code>def describe(name, age):

      <h4>Область видимости (scope)</h4>
      <p>Переменная, созданная внутри функции, — локальная: она существует, только пока функция выполняется, и не видна снаружи.</p>
      <pre><code>x = 10

def change():
    x = 20   # это НОВАЯ локальная переменная, а не та, что снаружи

print(change(), x)   # 20 10</code></pre>
      <p>Если внутри функции присвоить значение переменной с тем же именем, Python создаёт локальную копию, а не трогает внешнюю. Это защищает от случайных побочных эффектов: функция не может незаметно сломать что-то за своими пределами.</p>

      <p>Если действительно нужно изменить внешнюю переменную изнутри функции, а не создать новую локальную, используют <code>global</code>:</p>
      <pre><code>counter = 0

      <p>Иногда код не может выполниться так, как задумано: файла нет, пользователь ввёл не число, список пуст. Вместо того чтобы программа просто падала, Python даёт способ такие ситуации перехватывать.</p>
      <h4>try / except</h4>
      <pre><code>try:
    result = 10 / 0
except ZeroDivisionError:
    print("На ноль делить нельзя")</code></pre>
      <p>Код в <code>try</code> выполняется как обычно; если возникает ошибка нужного типа — управление уходит в <code>except</code>, и программа не падает.</p>
      <h4>Частые типы исключений</h4>
      <ul>
        <li><code>ZeroDivisionError</code> — деление на ноль</li>
        <li><code>ValueError</code> — значение не подходит по смыслу, например <code>int("привет")</code></li>
        <li><code>KeyError</code> — обращение к несуществующему ключу словаря</li>
        <li><code>TypeError</code> — операция применена не к тому типу, например <code>"5" + 5</code></li>
      </ul>
      <h4>Несколько except и общий случай</h4>
      <pre><code>try:
    x = int(input_value)
except ValueError:
    print("Это не похоже на число")
except Exception as e:
    print(f"Что-то пошло не так: {e}")</code></pre>
      <p>Специфичные <code>except</code> стоит писать раньше общих — иначе <code>except Exception</code> перехватит всё раньше, чем дело дойдёт до конкретных случаев.</p>
      <h4>raise: сообщить об ошибке самому</h4>
      <p>Обработка исключений — это не только их ловить, но и создавать: если функция получила некорректные данные, она может сама сообщить об этом через <code>raise</code>, вместо того чтобы молча возвращать что-то неправильное.</p>
      <pre><code>def set_age(age):
    if age &lt; 0:
        raise ValueError("Возраст не может быть отрицательным")
    return age</code></pre>
      <p>Вызывающий код сам решает, ловить это исключение через try/except или нет — но ошибка как минимум не останется незамеченной.</p>

      <pre><code>try:
    ...
finally:
    print("Это выполнится всегда")</code></pre>

      <h4>Модули</h4>
      <p>Модуль — это просто файл с расширением <code>.py</code>. Если в файле <code>utils.py</code> есть функция <code>greet</code>, её можно использовать в другом файле:</p>

      <p>Стандартная библиотека Python — тоже набор готовых модулей:</p>
      <pre><code>import math
print(math.sqrt(16))     # 4.0

import json
print(json.dumps({"a": 1}))   # '{"a": 1}'</code></pre>
      <h4>Пакеты</h4>
      <p>Пакет — это папка с несколькими модулями внутри. Так организуют более крупные проекты: например, <code>myapp/models.py</code>, <code>myapp/routes.py</code>, <code>myapp/utils.py</code> — всё это части пакета <code>myapp</code>.</p>
      <h4>if __name__ == "__main__"</h4>
      <p>Когда файл импортируют как модуль, весь код верхнего уровня в нём всё равно выполняется. Чтобы отделить «код для запуска напрямую» от «кода для импорта», используют:</p>
      <pre><code># utils.py
def greet(name):
    return f"Привет, {name}!"

if __name__ == "__main__":

                            # а не при "from utils import greet"</code></pre>
      <p><code>__name__</code> равен <code>"__main__"</code> только когда файл запущен напрямую; при импорте он равен имени модуля.</p>
      <h4>Зачем нужны виртуальные окружения</h4>
      <p>Разные проекты часто требуют разных версий одних и тех же библиотек. Если ставить всё глобально на компьютер, версии рано или поздно начнут конфликтовать. Виртуальное окружение (venv) — изолированная папка со своим набором библиотек для конкретного проекта.</p>
      <pre><code>python -m venv .venv        # создать окружение

      <h4>poetry как альтернатива</h4>
      <p><code>poetry</code> — более современный инструмент: он не только создаёт виртуальное окружение, но и управляет зависимостями через файл <code>pyproject.toml</code>, фиксируя точные версии в <code>poetry.lock</code> — это надёжнее, чем вручную поддерживать <code>requirements.txt</code>.</p>
      <pre><code>poetry add fastapi     # добавить зависимость и обновить lock-файл

  'git-1': {
    nodeId: 'git',
    title: 'Коммиты и история',
    theory: `<div class="lesson-theory">
      <p>Git — система контроля версий: она запоминает историю изменений кода, позволяет откатиться к любому моменту и работать над кодом нескольким людям одновременно, не затирая чужие правки.</p>
      <h4>Локальный и удалённый репозиторий</h4>
      <p>Репозиторий бывает локальным (на компьютере) и удалённым (на GitHub/GitLab). Удалённый репозиторий, с которым синхронизируется локальный, по умолчанию называется <code>origin</code> — это просто имя-псевдоним для его адреса.</p>
      <pre><code>git clone https://github.com/user/repo.git   # скопировать существующий репозиторий целиком — origin уже настроен
# если же начинаете локально с нуля:
git init
git remote add origin https://github.com/user/repo.git   # привязать origin вручную</code></pre>
      <p>Если репозиторий уже существует на GitHub, обычно используют <code>git clone</code>, а не <code>git init</code>: он скачивает весь код и историю и сразу настраивает <code>origin</code>. <code>git init</code> нужен только для репозитория, которого ещё не существует нигде.</p>
      <h4>Инициализация и статус</h4>
      <pre><code>git init      # превратить папку в git-репозиторий
git status    # что изменилось с последнего коммита</code></pre>
      <h4>Индекс (staging area) и коммиты</h4>
      <p>Git не сохраняет изменения сразу — сначала их нужно добавить в индекс (staging area), а потом зафиксировать коммитом:</p>
      <pre><code>git add app.py    # добавить конкретный файл в индекс
git add .          # добавить вообще все изменения
git commit -m "Добавил роут для логина"   # зафиксировать с сообщением</code></pre>
      <p>Два шага (add → commit) — не лишняя бюрократия: они позволяют выбрать, что именно попадёт в коммит, а не тащить туда вообще все правки подряд.</p>
      <h4>История и различия</h4>
      <pre><code>git log     # история коммитов

    theory: `<div class="lesson-theory">
      <h4>Что такое ветка</h4>
      <p>Ветка (branch) — это указатель на коммит, который двигается вперёд по мере новых коммитов. По умолчанию есть одна ветка (обычно <code>main</code>), а любая новая ветка — способ разрабатывать что-то отдельно, не трогая основной код.</p>
      <h4>Создание и переключение</h4>
      <pre><code>git branch                     # список веток, текущая помечена *
git checkout -b feature-login  # создать ветку и сразу переключиться
git switch -c feature-login    # современный аналог той же команды</code></pre>
      <p><code>checkout</code> — старая универсальная команда с слишком большим числом обязанностей. <code>switch</code> — более новая и понятная замена именно для переключения между ветками.</p>
      <h4>Слияние (merge)</h4>
      <p>Когда работа в ветке готова, её сливают обратно:</p>
      <pre><code>git checkout main        # или git switch main
git merge feature-login  # слить feature-login в main</code></pre>
      <h4>Конфликты слияния</h4>
      <p>Если в main и в feature-login изменили одну и ту же строку по-разному, Git не может решить сам — возникает конфликт. Git отмечает спорное место прямо в файле:</p>
      <pre><code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD
твоя версия строки
=======
версия из другой ветки
&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature-login</code></pre>
      <p>Нужно вручную оставить нужный вариант (или совместить оба), убрать служебные строки-разделители, а затем <code>git add</code> и <code>git commit</code> — это завершит слияние.</p>
      <h4>После слияния</h4>
      <pre><code>git branch -d feature-login   # удалить ветку, она больше не нужна</code></pre>
    </div>`,

      <p>Слить ветку в main можно и локально, командой git merge. Но в команде это рискованно: код попадёт в общий main без чужого взгляда со стороны. Pull Request (PR; в GitLab — Merge Request) показывает изменения до того, как они попадут в main, и даёт команде их обсудить.</p>
      <h4>Как это выглядит на практике</h4>
      <pre><code>git push -u origin feature-login   # первый пуш ветки: -u привязывает её к origin

      <p>После пуша на GitHub/GitLab открывается Pull Request, сравнивающий вашу ветку с main. В нём видно список коммитов, построчный diff изменений и ленту обсуждения.</p>
      <h4>Code review</h4>
      <p>Ревьюер читает diff и оставляет комментарии — к отдельным строкам и общие. Обычно проверяют: корректность логики, читаемость, покрытие тестами, граничные случаи, соответствие стилю. Если нужно поправить — не открывают новый PR, а правят код локально и снова:</p>
      <pre><code>git add .
git commit -m "Fix review comments"
git push</code></pre>
      <p>Новые коммиты сами появятся в том же PR.</p>
      <h4>Слияние PR</h4>
      <p>После одобрения PR сливают одним из трёх способов: <strong>merge commit</strong> (сохраняет всю историю коммитов ветки), <strong>squash and merge</strong> (сжимает ветку в один коммит — чище история main) или <strong>rebase and merge</strong> (переносит коммиты поверх main без отдельного merge-коммита). Какой использовать, обычно решает команда — один раз для всего репозитория.</p>

      <pre><code>pwd              # где я сейчас (полный путь)

      <h4>Удаление — осторожно</h4>
      <pre><code>rm app.py         # удалить файл
rm -rf папка/     # удалить папку рекурсивно и без подтверждения</code></pre>
      <p><code>rm -rf</code> ничего не спрашивает и не кладёт файлы в корзину — удалённое не восстановить стандартными средствами. Перед такой командой стоит перепроверить путь.</p>
      <h4>Переменные окружения</h4>
      <p>Переменная окружения — именованное значение, доступное процессам в текущей сессии терминала (и тем, что из неё запущены), а не часть кода программы.</p>
      <pre><code>export API_KEY=secret123   # задать переменную
echo $API_KEY               # посмотреть значение</code></pre>
      <p>Backend-приложения читают такие переменные через код (в Python — <code>os.environ["API_KEY"]</code>), а не хранят секреты прямо в файлах — иначе ключ рано или поздно попадёт в git.</p>
      <h4>.env-файлы</h4>
      <p>Чтобы не экспортировать переменные вручную каждый раз, их обычно кладут в файл <code>.env</code>, который приложение подхватывает автоматически при старте — и, как уже говорилось в уроке про git, обязательно добавляют в <code>.gitignore</code>.</p>

      <h4>Реляционная модель</h4>
      <p>Реляционная база хранит данные в таблицах: у каждой строки — одинаковый набор столбцов. Например, таблица users:</p>
      <table><tr><th>id</th><th>name</th><th>age</th></tr><tr><td>1</td><td>Аня</td><td>25</td></tr><tr><td>2</td><td>Игорь</td><td>31</td></tr></table>
      <p><code>id</code> обычно — первичный ключ (PRIMARY KEY): уникальный идентификатор строки.</p>
      <h4>SELECT, WHERE, ORDER BY, LIMIT</h4>
      <pre><code>SELECT name, age FROM users
WHERE age > 20
ORDER BY age DESC
LIMIT 1;</code></pre>
      <p><code>SELECT</code> — какие столбцы вернуть (или <code>*</code> — все); <code>FROM</code> — из какой таблицы; <code>WHERE</code> — фильтр по строкам; <code>ORDER BY</code> — сортировка (<code>DESC</code> — по убыванию, <code>ASC</code> — по возрастанию, по умолчанию); <code>LIMIT</code> — максимум строк в ответе.</p>
      <h4>Несколько условий сразу</h4>
      <p>Условия в WHERE комбинируют через <code>AND</code> и <code>OR</code>, как в Python:</p>
      <pre><code>SELECT name FROM users WHERE age >= 20 AND age &lt;= 35;
-- то же самое короче:
SELECT name FROM users WHERE age BETWEEN 20 AND 35;</code></pre>
      <h4>SQL прямо в Python</h4>
      <p>В стандартной библиотеке Python есть модуль <code>sqlite3</code> — настоящая SQL-база прямо в памяти, без установки сервера:</p>
      <pre><code>import sqlite3

cur = conn.cursor()
cur.execute('CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER)')
cur.execute("INSERT INTO users (name, age) VALUES ('Аня', 25)")
cur.execute('SELECT * FROM users')
print(cur.fetchall())   # [(1, 'Аня', 25)]</code></pre>
      <p>На этом и тренируемся: вся практика этого модуля — настоящий SQL внутри sqlite3.</p>

      <h4>INSERT: добавить строку</h4>
      <pre><code>INSERT INTO users (name, age) VALUES ('Марк', 42);</code></pre>
      <p>Перечисляем столбцы и подставляем значения в том же порядке. Если пропустить столбец, у которого нет значения по умолчанию и нет NULL — вставка упадёт с ошибкой.</p>
      <h4>UPDATE: изменить существующие строки</h4>
      <pre><code>UPDATE users SET age = 26 WHERE name = 'Аня';</code></pre>
      <p>WHERE здесь обязателен почти всегда: без него UPDATE обновит ВСЕ строки таблицы разом.</p>
      <h4>DELETE: удалить строки</h4>
      <pre><code>DELETE FROM users WHERE age &lt; 18;</code></pre>
      <p>Та же логика: без WHERE удалятся вообще все строки. Это одна из самых частых аварийных ситуаций в SQL — стоит сначала прогнать тот же WHERE через SELECT, чтобы увидеть, что именно попадёт под удаление, и только потом переключать на DELETE.</p>
      <h4>NULL — отсутствие значения</h4>
      <p>NULL — это не 0 и не пустая строка, а «значение неизвестно». Сравнение <code>= NULL</code> поэтому никогда не сработает — нужны специальные операторы:</p>
      <pre><code>SELECT * FROM users WHERE email IS NULL;
SELECT * FROM users WHERE email IS NOT NULL;</code></pre>
      <h4>LIKE — поиск по шаблону</h4>
      <pre><code>SELECT * FROM users WHERE name LIKE 'А%';</code></pre>
      <p><code>%</code> заменяет любое количество любых символов, <code>_</code> — ровно один символ.</p>

      <h4>Зачем несколько таблиц</h4>
      <p>Вместо дублирования данных связанные сущности хранят в отдельных таблицах и связывают через внешний ключ (foreign key): у каждого заказа есть покупатель, но имя покупателя хранится только в users.</p>
      <h4>JOIN</h4>
      <pre><code>SELECT orders.id, users.name, orders.amount
FROM orders
JOIN users ON orders.user_id = users.id;</code></pre>
      <p>JOIN связывает строки двух таблиц там, где совпадает условие после <code>ON</code>. Это INNER JOIN — вернутся только строки, у которых есть совпадение в обеих таблицах. LEFT JOIN вернёт вообще все строки левой таблицы, даже без совпадения (тогда столбцы правой будут NULL).</p>
      <h4>GROUP BY и агрегатные функции</h4>
      <pre><code>SELECT user_id, COUNT(*), SUM(amount)
FROM orders
GROUP BY user_id;</code></pre>
      <p>GROUP BY схлопывает строки с одинаковым значением столбца в одну группу, а агрегатные функции (COUNT, SUM, AVG, MIN, MAX) считают что-то по каждой группе.</p>
      <h4>HAVING</h4>
      <p>WHERE фильтрует строки до группировки, HAVING — уже результаты группировки:</p>

FROM orders
GROUP BY user_id
HAVING total > 100;</code></pre>

    theory: `<div class="lesson-theory">
      <h4>Зачем нормализация</h4>
      <p>Если хранить имя покупателя прямо в каждой строке заказа, при смене имени пришлось бы обновлять сотни строк — и легко получить рассинхрон. Нормализация — разнесение данных так, чтобы каждый факт хранился только в одном месте: имя — в users, а orders только ссылается на users.id.</p>
      <pre><code>-- хуже: имя дублируется в каждом заказе
CREATE TABLE orders_bad (id INTEGER, customer_name TEXT, amount REAL);

-- лучше: имя в одном месте, заказ просто ссылается
CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT);
CREATE TABLE orders (id INTEGER PRIMARY KEY, user_id INTEGER, amount REAL,
                      FOREIGN KEY (user_id) REFERENCES users(id));</code></pre>
      <h4>Индексы</h4>
      <p>Без индекса поиск по столбцу — это перебор всех строк одна за одной. Индекс — дополнительная структура (обычно дерево), которая делает поиск по столбцу гораздо быстрее:</p>
      <pre><code>CREATE INDEX idx_orders_user_id ON orders(user_id);</code></pre>
      <p>Индекс ускоряет чтение, но чуть замедляет запись (INSERT/UPDATE должны обновлять ещё и индекс) и занимает место — поэтому индексы ставят не на каждый столбец подряд, а туда, где реально часто ищут или джойнят.</p>
      <h4>UNIQUE: запретить дубликаты не через ключ</h4>
      <p>PRIMARY KEY — не единственный способ гарантировать уникальность. Если, например, название категории должно быть уникальным (но это не первичный ключ), используют UNIQUE:</p>
      <pre><code>CREATE TABLE categories (id INTEGER PRIMARY KEY, title TEXT UNIQUE);</code></pre>
      <p>Попытка вставить вторую строку с уже существующим title вызовет ошибку (в Python — sqlite3.IntegrityError), которую можно поймать через try/except.</p>

      <h4>Зачем нужны транзакции</h4>
      <p>Транзакция — группа операций, которые должны выполниться все вместе или не выполниться вовсе. Классика — перевод денег: списать с одного счёта и зачислить на другой обязаны случиться синхронно, иначе деньги пропадут или задвоятся.</p>
      <pre><code>try:
    conn.execute('UPDATE accounts SET balance = balance - 100 WHERE id = 1')
    conn.execute('UPDATE accounts SET balance = balance + 100 WHERE id = 2')
    conn.commit()      # обе операции сохранились вместе
except Exception:
    conn.rollback()    # откатить обе, если хоть одна упала</code></pre>
      <h4>ACID</h4>
      <ul>
        <li><strong>Atomicity</strong> (атомарность) — транзакция целиком или не выполняется вовсе</li>
        <li><strong>Consistency</strong> (согласованность) — база переходит из одного корректного состояния в другое, не нарушая ограничения</li>
        <li><strong>Isolation</strong> (изолированность) — параллельные транзакции не видят промежуточные результаты друг друга</li>
        <li><strong>Durability</strong> (надёжность) — после commit данные не потеряются, даже если сервер внезапно упадёт</li>
      </ul>
      <h4>PostgreSQL</h4>
      <p>Все упражнения курса используют sqlite3 — он встроен в Python и не требует установки. PostgreSQL работает как отдельный сервер, но выученный SQL почти без изменений работает и там. Специфика PostgreSQL, важная для backend-разработки: более строгая типизация столбцов, продвинутые типы (JSONB, массивы), полнотекстовый поиск — и то, что реальные проекты почти всегда используют именно его (или MySQL), а не SQLite, в продакшене.</p>

      <h4>Что такое HTTP</h4>
      <p>HTTP — протокол «запрос-ответ» поверх TCP: клиент отправляет запрос, сервер отвечает. Протокол без состояния (stateless) — каждый запрос независим, сервер не помнит предыдущие сам по себе.</p>
      <h4>Структура запроса</h4>
      <pre><code>GET /users/42 HTTP/1.1
Host: api.example.com
Authorization: Bearer abc123</code></pre>
      <p>Метод (GET), путь (/users/42), заголовки (Host, Authorization) и, для некоторых методов, тело запроса.</p>
      <h4>Content-Type — что за формат в теле</h4>
      <p>Заголовок <code>Content-Type</code> говорит, в каком формате тело запроса или ответа. Для backend-разработки самый частый — <code>application/json</code>:</p>
      <pre><code>POST /users HTTP/1.1
Content-Type: application/json

{"name": "Аня", "age": 25}</code></pre>
      <p>Без правильного Content-Type сервер может не понять, как разбирать тело запроса, даже если сами данные написаны верно.</p>
      <h4>Методы</h4>
      <ul>
        <li><strong>GET</strong> — получить данные</li>
        <li><strong>POST</strong> — создать что-то новое</li>
        <li><strong>PUT</strong> — полностью заменить ресурс</li>
        <li><strong>PATCH</strong> — частично обновить ресурс</li>
        <li><strong>DELETE</strong> — удалить ресурс</li>
      </ul>
      <h4>Коды ответа</h4>
      <ul>
        <li>1xx — информационные (используются редко)</li>
        <li>2xx — успех: 200 OK, 201 Created, 204 No Content</li>
        <li>3xx — перенаправление: 301 Moved Permanently, 302 Found</li>
        <li>4xx — ошибка клиента: 400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found, 422 Unprocessable Entity</li>
        <li>5xx — ошибка сервера: 500 Internal Server Error, 503 Service Unavailable</li>
      </ul>
      <p>Первая цифра сразу говорит, к какой категории относится ответ — это стоит запомнить в первую очередь.</p>

/* ================= STATE ================= */
const STORE_KEY = 'academy_state_v1';
function loadState(){
  const defaults = {streak:0, lastVisit:null, mastered:[], theme:null, completedLessons:[]};
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      return Object.assign({}, defaults, parsed, {
        mastered: Array.isArray(parsed.mastered) ? parsed.mastered : [],
        completedLessons: Array.isArray(parsed.completedLessons) ? parsed.completedLessons : []
      });
    }
  }catch(e){}
  return defaults;
}
function saveState(s){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){}
}
let state = loadState();

function todayStr(){ return new Date().toDateString(); }
function bumpStreak(){
  const today = todayStr();
  if(state.lastVisit === today) return;
  if(state.lastVisit){
    const prev = new Date(state.lastVisit);
    const diffDays = Math.round((new Date(today) - prev) / 86400000);
    state.streak = (diffDays === 1) ? state.streak + 1 : 1;
  } else {
    state.streak = 1;
  }
  state.lastVisit = today;
  saveState(state);
}
bumpStreak();

function isMastered(id){
  if(state.mastered.includes(id)) return true;
  const lessonIds = LESSON_ORDER[id];
  const node = NODES_BY_ID[id];
  if(!lessonIds || !node || lessonIds.length===0 || lessonIds.length < node.outline.length) return false;
  return lessonIds.every(function(lid){ return state.completedLessons.includes(lid); });
}
function nodeState(node){
  if(isMastered(node.id)) return 'mastered';
  const unmet = node.prereqs.filter(p=>!isMastered(p));
  return unmet.length===0 ? 'available' : 'locked';
}
function unmetPrereqs(node){ return node.prereqs.filter(p=>!isMastered(p)); }
function toggleMastered(id, on){
  state.mastered = state.mastered.filter(x=>x!==id);
  if(on) state.mastered.push(id);
  saveState(state);
}

/* ================= DIAGNOSTIC QUIZ ================= */
let diagState = null;
function startDiag(){ diagState = {stage:'core', idx:0, coreAnswers:[], advAnswers:[], revealed:false}; render(); }
function selectDiagAnswer(i){
  if(!diagState || diagState.revealed) return;
  const arr = diagState.stage==='advanced' ? diagState.advAnswers : diagState.coreAnswers;
  arr[diagState.idx] = i;
  diagState.revealed = true;
  render();
}
function nextDiagQuestion(){
  if(!diagState) return;
  diagState.idx++;
  diagState.revealed = false;
  if(diagState.stage==='core' && diagState.idx >= CORE_QUESTIONS.length){
    diagState.stage = 'offer';
    diagState.idx = 0;
  } else if(diagState.stage==='advanced' && diagState.idx >= ADVANCED_QUESTIONS.length){
    diagState.stage = 'results';
    toggleMastered('diag', true);
  }
  render();
}
function goAdvancedDiag(){
  if(!diagState) return;
  diagState.stage = 'advanced'; diagState.idx = 0; diagState.revealed = false;
  render();
}
function skipAdvancedDiag(){
  if(!diagState) return;
  diagState.stage = 'results';
  toggleMastered('diag', true);
  render();
}
function restartDiag(){ diagState = {stage:'core', idx:0, coreAnswers:[], advAnswers:[], revealed:false}; render(); }
function diagCategories(){
  const defs = [
    {id:'py-basics', title:'Python-основы', list:CORE_QUESTIONS, answers:diagState.coreAnswers, optional:false},
    {id:'git', title:'Git', list:CORE_QUESTIONS, answers:diagState.coreAnswers, optional:false},
    {id:'sql', title:'SQL', list:CORE_QUESTIONS, answers:diagState.coreAnswers, optional:false},
    {id:'http', title:'HTTP', list:CORE_QUESTIONS, answers:diagState.coreAnswers, optional:false},
    {id:'oop', title:'ООП (продвинутый блок)', list:ADVANCED_QUESTIONS, answers:diagState.advAnswers, optional:true},
    {id:'algo', title:'Алгоритмы (продвинутый блок)', list:ADVANCED_QUESTIONS, answers:diagState.advAnswers, optional:true}
  ];
  return defs.map(function(c){
    const idxs = [];
    c.list.forEach(function(q,i){ if(q.cat===c.id) idxs.push(i); });
    const total = idxs.length;
    const attempted = c.answers.length > 0;
    const score = idxs.filter(function(i){ return c.answers[i]===c.list[i].correct; }).length;
    return {id:c.id, title:c.title, total:total, score:score, perfect: total>0 && score===total, optional:c.optional, attempted:attempted};
  }).filter(function(c){ return !c.optional || c.attempted; });
}

/* ================= LESSONS ================= */
let lessonState = null;
function ensureLessonState(id){
  if(!lessonState || lessonState.lessonId !== id){
    const l = LESSONS[id];
    lessonState = {
      lessonId: id, stage: 'theory',
      checkIdx: 0, checkAnswers: [], checkRevealed: false,
      practiceCode: l.practice.starter || '', practiceHintLevel: 0, practiceStatus: null, practiceOutput: '', practiceMessage: '',
      taskCode: l.task.starter || '', taskHintLevel: 0, taskStatus: null, taskOutput: '', taskMessage: ''
    };
    if(l.practice2){
      lessonState.practice2Code = l.practice2.starter || '';
      lessonState.practice2HintLevel = 0; lessonState.practice2Status = null; lessonState.practice2Output = ''; lessonState.practice2Message = '';
    }
    if(l.task2){
      lessonState.task2Code = l.task2.starter || '';
      lessonState.task2HintLevel = 0; lessonState.task2Status = null; lessonState.task2Output = ''; lessonState.task2Message = '';
    }
    if(l.debug){
      lessonState.debugCode = l.debug.starter || '';
      lessonState.debugHintLevel = 0; lessonState.debugStatus = null; lessonState.debugOutput = ''; lessonState.debugMessage = '';
    }
  }
}
function answerLessonCheck(i){
  if(!lessonState || lessonState.checkRevealed) return;
  lessonState.checkAnswers[lessonState.checkIdx] = i;
  lessonState.checkRevealed = true;
  render();
}
function advanceLessonStage(next){
  if(!lessonState) return;
  if(next === 'next-check'){
    lessonState.checkIdx++;
    lessonState.checkRevealed = false;
    render();
    return;
  }
  lessonState.stage = next;
  render();
}
function lessonHint(stage){
  if(!lessonState) return;
  const ta = document.getElementById('lesson-code');
  if(ta) lessonState[stage+'Code'] = ta.value;
  const max = LESSONS[lessonState.lessonId][stage].hints.length - 1;
  lessonState[stage+'HintLevel'] = Math.min(max, lessonState[stage+'HintLevel'] + 1);
  render();
}
function markLessonComplete(id){
  if(state.completedLessons.indexOf(id) === -1) state.completedLessons.push(id);
  saveState(state);
}
async function verifyLessonStage(stage){
  if(!lessonState) return;
  const ta = document.getElementById('lesson-code');
  const code = ta ? ta.value : lessonState[stage+'Code'];
  lessonState[stage+'Code'] = code;
  lessonState[stage+'Status'] = 'running';
  lessonState[stage+'Output'] = '';
  render();
  const block = LESSONS[lessonState.lessonId][stage];
  let output = '', passed = false, message = '';
  let loaded = true;
  try{
    var pyodide = await getPyodide();
  }catch(e){ loaded = false; }
  if(!loaded){
    lessonState[stage+'Status'] = 'error';
    lessonState[stage+'Output'] = 'Не получилось загрузить песочницу. Проверь соединение и попробуй ещё раз.';
    render();
    return;
  }
  pyodide.setStdout({batched:function(s){ output += s + '\n'; }});
  pyodide.setStderr({batched:function(s){ output += s + '\n'; }});
  try{
    pyodide.runPython(code + '\n' + block.test);
    try{
      passed = !!pyodide.globals.get('__result__');
      const m = pyodide.globals.get('__message__');
      message = m ? String(m) : '';
    }catch(e){ passed = false; message = 'Не удалось прочитать результат проверки.'; }
  }catch(err){
    passed = false;
    message = String(err);
  }
  lessonState[stage+'Status'] = passed ? 'pass' : 'fail';
  lessonState[stage+'Output'] = output;
  lessonState[stage+'Message'] = message;
  if(passed && stage==='task') markLessonComplete(lessonState.lessonId);
  render();
}
function verifyCommandStage(stage){
  if(!lessonState) return;
  const ta = document.getElementById('lesson-code');
  const raw = ta ? ta.value : '';
  lessonState[stage+'Code'] = raw;
  const block = LESSONS[lessonState.lessonId][stage];
  const lines = raw.split('\n').map(function(s){ return s.trim().replace(/\s+/g,' '); }).filter(function(s){ return s.length>0; });
  const expected = block.expected;
  let passed = lines.length === expected.length;
  let message = '';
  if(passed){
    for(let i=0;i<expected.length;i++){
      if(!expected[i].re.test(lines[i])){ passed=false; message = 'Строка '+(i+1)+' не похожа на нужную команду.'; break; }
    }
  } else {
    message = 'Ожидалось строк: '+expected.length+', введено: '+lines.length+'.';
  }
  lessonState[stage+'Status'] = passed ? 'pass' : 'fail';
  lessonState[stage+'Message'] = message;
  if(passed && stage==='task') markLessonComplete(lessonState.lessonId);
  render();
}

/* ================= THEME ================= */
function effectiveDark(){
  if(document.documentElement.getAttribute('data-theme')==='dark') return true;
  if(document.documentElement.getAttribute('data-theme')==='light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyThemeIcon(){
  const dark = effectiveDark();
  const html = dark ? ICONS.sun : ICONS.moon;
  document.getElementById('theme-toggle-d').innerHTML = html;
  document.getElementById('theme-toggle-m').innerHTML = html;
}
function setTheme(mode){
  if(mode){ document.documentElement.setAttribute('data-theme', mode); state.theme = mode; }
  else { document.documentElement.removeAttribute('data-theme'); state.theme = null; }
  saveState(state);
  applyThemeIcon();
}
if(state.theme) document.documentElement.setAttribute('data-theme', state.theme);
function toggleTheme(){ setTheme(effectiveDark() ? 'light' : 'dark'); }

function viewTopic(id){
  if(id==='diag') return viewDiagnostic();
  const n = NODES_BY_ID[id];
  if(!n) return `<div class="container"><p>Тема не найдена.</p><a href="#/map" class="btn btn-ghost">К карте</a></div>`;
  const st = nodeState(n);
  const stageTitle = STAGES[n.stage].title;
  let tag = '';
  if(st==='mastered') tag = `<span class="state-tag state-tag--mastered">${ICONS.check} Пройдено</span>`;
  else if(st==='available') tag = `<span class="state-tag state-tag--available">${ICONS.dot} Можно начинать</span>`;
  else tag = `<span class="state-tag state-tag--locked">${ICONS.lock} Пока закрыто</span>`;

  let lockedBlock = '';
  if(st==='locked'){
    const names = unmetPrereqs(n).map(p=>`<a href="#/topic/${p}" class="prereq-pill">${NODES_BY_ID[p].title}</a>`).join('');
    lockedBlock = `<div class="notice"><strong>Нужно сначала закрыть:</strong><div class="prereq-list">${names}</div></div>`;
  }

  const lessonIds = LESSON_ORDER[n.id] || [];
  const earnedViaLessons = st==='mastered' && !state.mastered.includes(n.id);

  let masteryBlock = '';
  if(st!=='locked'){
    if(st==='mastered' && earnedViaLessons){
      masteryBlock = `<div class="mastery-box"><p class="meta">${ICONS.check} Все уроки модуля пройдены по-настоящему — эта тема закрыта честно, без ручной отметки.</p></div>`;
    } else if(st==='mastered'){
      masteryBlock = `<div class="mastery-box"><p class="meta" style="margin-bottom:8px;">Отмечено как известная тема.</p><button class="btn btn-ghost" data-unmaster="${n.id}">Отменить отметку</button></div>`;
    } else {
      masteryBlock = `<div class="mastery-box"><p class="meta" style="margin-bottom:8px;">Можно пройти по урокам ниже, а если тема и так знакома целиком — отметить вручную, чтобы двигаться по дереву дальше.</p><button class="btn btn-clay" data-master="${n.id}">Я уже уверенно знаю эту тему</button></div>`;
    }
  }

  const hasLessons = lessonIds.length > 0;
  const doneCount = lessonIds.filter(function(lid){ return state.completedLessons.includes(lid); }).length;

  const outlineHTML = n.outline.map(function(o){
    if(typeof o === 'string'){
      return `<li>${ICONS.bullet}<span>${o} <span class="meta">— скоро</span></span></li>`;
    }
    const done = state.completedLessons.includes(o.lessonId);
    return `<li><a href="#/lesson/${o.lessonId}">${done?ICONS.check:ICONS.dot}<span>${o.title}${done?' <span class="meta">— пройдено</span>':''}</span></a></li>`;
  }).join('');

  let contentNotice;
  if(hasLessons){
    const remaining = n.outline.length - lessonIds.length;
    contentNotice = `Готово ${lessonIds.length} из ${n.outline.length} уроков модуля, пройдено ${doneCount} из ${lessonIds.length}.` + (remaining>0 ? ' Остальное появится в одной из ближайших сессий.' : '');
  } else {
    contentNotice = 'Полный урок ещё не готов: сначала короткая теория и мгновенная мини-проверка, потом практика с подсказками и итоговое задание. Появится в одной из ближайших сессий.';
  }

  return `
    <div class="container">
      <a href="#/map" class="back-link">${ICONS.chevronLeft} К карте навыков</a>
      <div class="topic-badge">${stageTitle} · ${n.bonus?'бонус':'модуль № '+n.num}</div>
      <h1 style="margin-bottom:12px;">${n.title}</h1>
      ${tag}
      <p>${n.summary}</p>
      <h3 style="margin:20px 0 4px;">Что внутри</h3>
      <ul class="outline-list">
        ${outlineHTML}
      </ul>
      ${lockedBlock}
      <div class="notice" style="margin-top:16px;">${contentNotice}</div>
      ${masteryBlock}
    </div>`;
}

function diagQuestionHTML(list, answers, badge){
  const total = list.length;
  const idx = diagState.idx;
  const q = list[idx];
  const sel = answers[idx];
  const revealed = diagState.revealed;
  const pct = Math.round(idx/total*100);
  const optsHTML = q.options.map(function(opt,i){
    let cls = 'quiz-opt';
    if(revealed){
      if(i===q.correct) cls += ' quiz-opt--correct';
      else if(i===sel) cls += ' quiz-opt--wrong';
    }
    return `<button class="${cls}" data-diag-answer="${i}" ${revealed?'disabled':''}>${opt}</button>`;
  }).join('');
  const isLast = idx+1 >= total;
  const nextLabel = isLast ? (diagState.stage==='core' ? 'Дальше' : 'Смотреть результат') : 'Следующий вопрос';
  const feedback = revealed ? `
    <div class="notice" style="margin-top:14px;white-space:pre-line;">${sel===q.correct?'Верно. ':'Не совсем. '}${q.explain}</div>
    <button class="btn btn-primary" style="margin-top:14px;" data-diag-next>${nextLabel} ${ICONS.arrowRight}</button>` : '';
  return `
    <div class="container">
      <a href="#/map" class="back-link">${ICONS.chevronLeft} К карте навыков</a>
      <div class="topic-badge">${badge} · вопрос ${idx+1} из ${total}</div>
      <div class="quiz-progress"><div class="quiz-progress__bar" style="width:${pct}%;"></div></div>
      <h2 style="margin-bottom:16px;white-space:pre-line;">${q.text}</h2>
      <div style="display:flex;flex-direction:column;gap:9px;">${optsHTML}</div>
      ${feedback}
    </div>`;
}

function diagResultsHTML(){
  const cats = diagCategories();
  const totalScore = cats.reduce(function(a,c){ return a+c.score; },0);
  const totalQ = cats.reduce(function(a,c){ return a+c.total; },0);
  const catsHTML = cats.map(function(c){
    let action;
    if(c.perfect && isMastered(c.id)) action = `<p class="meta" style="color:var(--moss-deep);">${ICONS.check} отмечено как известная</p>`;
    else if(c.perfect) action = `<button class="btn btn-clay" data-diag-mark="${c.id}" style="margin-top:6px;">Отметить как известную</button>`;
    else if(c.optional) action = `<p class="meta">Не страшно — эта тема ещё впереди по программе.</p>`;
    else action = `<p class="meta">Стоит пройти по плану.</p>`;
    return `<div class="panel" style="margin-bottom:0;"><h3>${c.title}</h3><p class="meta">${c.score} из ${c.total} верно</p>${action}</div>`;
  }).join('');
  return `
    <div class="container">
      <a href="#/map" class="back-link">${ICONS.chevronLeft} К карте навыков</a>
      <div class="topic-badge">Диагностика · результат</div>
      <h1 style="margin-bottom:6px;">Готово: ${totalScore} из ${totalQ}</h1>
      <p class="meta" style="margin-bottom:18px;">Это не экзамен, а ориентир — вот что можно сделать с каждой веткой.</p>
      <div class="node-grid">${catsHTML}</div>
      <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;">
        <a href="#/map" class="btn btn-primary">К карте навыков ${ICONS.arrowRight}</a>
        <button class="btn btn-ghost" data-diag-restart>Пройти ещё раз</button>
      </div>
    </div>`;
}

function viewLesson(id){
  if(!LESSONS[id]) return `<div class="container"><p>Урок не найден.</p><a href="#/map" class="btn btn-ghost">К карте</a></div>`;
  ensureLessonState(id);
  const stage = lessonState.stage;
  if(stage==='theory') return lessonTheoryHTML();
  if(stage==='check') return lessonCheckHTML();
  if(stage==='practice') return lessonStageHTML('practice');
  if(stage==='task') return lessonStageHTML('task');
  if(stage==='practice2') return lessonStageHTML('practice2');
  if(stage==='task2') return lessonStageHTML('task2');
  if(stage==='debug') return lessonStageHTML('debug');
  return lessonDoneHTML();
}
function lessonBackLink(){
  const l = LESSONS[lessonState.lessonId];
  return `<a href="#/topic/${l.nodeId}" class="back-link">${ICONS.chevronLeft} К теме «${NODES_BY_ID[l.nodeId].title}»</a>`;
}
function lessonTheoryHTML(){
  const l = LESSONS[lessonState.lessonId];
  return `
    <div class="container">
      ${lessonBackLink()}
      <div class="topic-badge">Урок · теория</div>
      <h1 style="margin-bottom:14px;">${l.title}</h1>
      ${l.theory}
      <button class="btn btn-primary" style="margin-top:8px;" data-lesson-next="check">Дальше: мини-проверка ${ICONS.arrowRight}</button>
    </div>`;
}
function lessonCheckHTML(){
  const l = LESSONS[lessonState.lessonId];
  const checks = l.checks;
  const idx = lessonState.checkIdx;
  const c = checks[idx];
  const sel = lessonState.checkAnswers[idx];
  const revealed = lessonState.checkRevealed;
  const optsHTML = c.options.map(function(opt,i){
    let cls = 'quiz-opt';
    if(revealed){
      if(i===c.correct) cls += ' quiz-opt--correct';
      else if(i===sel) cls += ' quiz-opt--wrong';
    }
    return `<button class="${cls}" data-lesson-check="${i}" ${revealed?'disabled':''}>${opt}</button>`;
  }).join('');
  const isLast = idx+1 >= checks.length;
  const nextTarget = isLast ? 'practice' : 'next-check';
  const nextLabel = isLast ? 'Дальше: практика' : 'Следующий вопрос';
  const feedback = revealed ? `
    <div class="notice" style="margin-top:14px;">${sel===c.correct?'Верно. ':'Не совсем. '}${c.explain}</div>
    <button class="btn btn-primary" style="margin-top:14px;" data-lesson-next="${nextTarget}">${nextLabel} ${ICONS.arrowRight}</button>` : '';
  return `
    <div class="container">
      ${lessonBackLink()}
      <div class="topic-badge">Урок · мини-проверка ${idx+1} из ${checks.length}</div>
      <h2 style="margin-bottom:16px;">${c.q}</h2>
      <div style="display:flex;flex-direction:column;gap:9px;">${optsHTML}</div>
      ${feedback}
    </div>`;
}
function lessonStageSequence(l){
  const seq = ['practice','task'];
  if(l.practice2) seq.push('practice2');
  if(l.task2) seq.push('task2');
  if(l.debug) seq.push('debug');
  return seq;
}
function lessonStageHTML(stage){
  const l = LESSONS[lessonState.lessonId];
  const block = l[stage];
  const isCommand = block.kind === 'command';
  const code = lessonState[stage+'Code'];
  const hintLevel = lessonState[stage+'HintLevel'];
  const status = lessonState[stage+'Status'];
  const output = lessonState[stage+'Output'];
  const message = lessonState[stage+'Message'];
  const labels = {practice:'практика', task:'итоговое задание', practice2:'практика — часть 2', task2:'итоговое задание — часть 2', debug:'найди и почини ошибку'};
  const label = labels[stage];
  let hintsHTML = '';
  for(let i=0;i<hintLevel;i++){
    const isSolution = i === block.hints.length-1;
    hintsHTML += `<div class="hint-box">${isSolution?'<strong>Решение:</strong>':'<strong>Подсказка '+(i+1)+':</strong>'}<pre>${block.hints[i]}</pre></div>`;
  }
  let resultHTML = '';
  if(status==='running') resultHTML = `<p class="meta" style="margin-top:12px;">Загружаю Python и проверяю…</p>`;
  else if(status==='pass') resultHTML = `<div class="result-box--pass">${ICONS.check} Готово, тест пройден!${output?'\n\n'+output:''}</div>`;
  else if(status==='fail') resultHTML = `<div class="result-box--fail">Пока не проходит: ${message}${output?'\n\n'+output:''}</div>`;
  else if(status==='error') resultHTML = `<div class="result-box--fail">${output}</div>`;
  const canAdvance = status==='pass';
  const seq = lessonStageSequence(l);
  const seqIdx = seq.indexOf(stage);
  const isLastOfSeq = seqIdx === seq.length-1;
  const nextStage = isLastOfSeq ? 'done' : seq[seqIdx+1];
  const nextLabel = isLastOfSeq ? 'Завершить урок' : (nextStage==='practice2' ? 'Дальше: ещё практика' : 'Дальше: итоговое задание');
  const nextBtn = `<button class="btn btn-primary" data-lesson-next="${nextStage}" ${canAdvance?'':'disabled'}>${nextLabel} ${ICONS.arrowRight}</button>`;
  const verifyAttr = isCommand ? 'data-lesson-verify-cmd' : 'data-lesson-verify';
  const editorHTML = isCommand
    ? `<textarea id="lesson-code" class="code-editor" spellcheck="false" placeholder="${block.placeholder||''}">${code}</textarea>`
    : `<textarea id="lesson-code" class="code-editor" spellcheck="false">${code}</textarea>`;
  return `
    <div class="container">
      ${lessonBackLink()}
      <div class="topic-badge">Урок · ${label}</div>
      <p style="font-size:1.05rem;">${block.prompt}</p>
      ${editorHTML}
      <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-primary" ${verifyAttr}="${stage}">${ICONS.play} Проверить</button>
        <button class="btn btn-ghost" data-lesson-hint="${stage}" ${hintLevel>=block.hints.length?'disabled':''}>Подсказка</button>
      </div>
      ${resultHTML}
      ${hintsHTML}
      <div style="margin-top:18px;">${nextBtn}</div>
    </div>`;
}
function lessonDoneHTML(){
  const l = LESSONS[lessonState.lessonId];
  const order = LESSON_ORDER[l.nodeId] || [];
  const idx = order.indexOf(lessonState.lessonId);
  const nextId = idx>=0 && idx+1<order.length ? order[idx+1] : null;
  return `
    <div class="container">
      <div class="topic-badge">Урок пройден</div>
      <h1 style="margin-bottom:12px;">${ICONS.check} «${l.title}» — готово!</h1>
      <p>Теория, мини-проверка, практика и итоговое задание — всё пройдено.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;">
        ${nextId ? `<a href="#/lesson/${nextId}" class="btn btn-primary">Следующий урок ${ICONS.arrowRight}</a>` : ''}
        <a href="#/topic/${l.nodeId}" class="btn btn-ghost">К теме «${NODES_BY_ID[l.nodeId].title}»</a>
      </div>
    </div>`;
}

const SANDBOX_DEFAULT = `print("Привет! Это твоя первая программа в браузере.")

for i in range(1, 4):
    print(f"Шаг {i}: код действительно выполняется.")
`;

function viewSandbox(){
  return `
    <div class="container">
      <h1 style="margin-bottom:6px;">Песочница</h1>
      <p class="meta" style="margin-bottom:18px;">Настоящий Python прямо в браузере, без установки — на этом будет держаться вся практика с кодом. Удобнее за компьютером, но можно и с телефона.</p>

          </div>

/* ================= ROUTER ================= */
function currentRoute(){
  const h = location.hash.replace(/^#/,'') || '/';
  return h;
}
function render(){
  const route = currentRoute();
  const root = document.getElementById('view-root');
  let navRoute = route;
  if(route==='/' || route==='/map' || route==='/sandbox'){
    root.innerHTML = route==='/' ? viewDashboard() : route==='/map' ? viewMap() : viewSandbox();
  } else if(route.indexOf('/topic/')===0){
    root.innerHTML = viewTopic(route.slice(7));
    navRoute = '/map';
  } else if(route.indexOf('/lesson/')===0){
    root.innerHTML = viewLesson(route.slice(8));
    navRoute = '/map';
  } else {
    root.innerHTML = viewDashboard();
    navRoute = '/';
  }
  markActiveNav(navRoute);
  document.getElementById('streak-num-d').textContent = state.streak;
  document.getElementById('streak-num-m').textContent = state.streak;
  window.scrollTo(0,0);
}

/* ================= EVENTS ================= */
document.addEventListener('click', function(e){
  const card = e.target.closest('[data-open]');
  if(card){ location.hash = '#/topic/' + card.getAttribute('data-open'); return; }
  const m = e.target.closest('[data-master]');
  if(m){ toggleMastered(m.getAttribute('data-master'), true); render(); return; }
  const um = e.target.closest('[data-unmaster]');
  if(um){ toggleMastered(um.getAttribute('data-unmaster'), false); render(); return; }
  if(e.target.closest('[data-diag-start]')){ startDiag(); return; }
  const da = e.target.closest('[data-diag-answer]');
  if(da){ selectDiagAnswer(parseInt(da.getAttribute('data-diag-answer'),10)); return; }
  if(e.target.closest('[data-diag-next]')){ nextDiagQuestion(); return; }
  if(e.target.closest('[data-diag-goadv]')){ goAdvancedDiag(); return; }
  if(e.target.closest('[data-diag-skipadv]')){ skipAdvancedDiag(); return; }
  if(e.target.closest('[data-diag-restart]')){ restartDiag(); return; }
  const dm = e.target.closest('[data-diag-mark]');
  if(dm){ toggleMastered(dm.getAttribute('data-diag-mark'), true); render(); return; }
  const ln = e.target.closest('[data-lesson-next]');
  if(ln){ advanceLessonStage(ln.getAttribute('data-lesson-next')); return; }
  const lc = e.target.closest('[data-lesson-check]');
  if(lc){ answerLessonCheck(parseInt(lc.getAttribute('data-lesson-check'),10)); return; }
  const lh = e.target.closest('[data-lesson-hint]');
  if(lh){ lessonHint(lh.getAttribute('data-lesson-hint')); return; }
  const lv = e.target.closest('[data-lesson-verify]');
  if(lv){ verifyLessonStage(lv.getAttribute('data-lesson-verify')); return; }
  const lvc = e.target.closest('[data-lesson-verify-cmd]');
  if(lvc){ verifyCommandStage(lvc.getAttribute('data-lesson-verify-cmd')); return; }
  if(e.target.id==='run-btn'){ runSandbox(); return; }
});
document.getElementById('theme-toggle-d').addEventListener('click', toggleTheme);
document.getElementById('theme-toggle-m').addEventListener('click', toggleTheme);
document.getElementById('reset-btn-d').addEventListener('click', function(){
  if(confirm('Сбросить весь прогресс и стрик? Это нельзя отменить.')){
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    state = {streak:0, lastVisit:null, mastered:[], theme:state.theme, completedLessons:[]};
    bumpStreak();
    render();
  }
});
window.addEventListener('hashchange', render);

/* ================= PYODIDE SANDBOX ================= */
const PYODIDE_VERSION = '314.0.7';
let pyodidePromise = null;
function getPyodide(){
  if(!pyodidePromise){
    pyodidePromise = new Promise(function(resolve, reject){
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/pyodide@' + PYODIDE_VERSION + '/pyodide.js';
      s.onload = function(){
        window.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/npm/pyodide@' + PYODIDE_VERSION + '/' })
          .then(resolve, reject);
      };
      s.onerror = function(){ reject(new Error('cdn-load-failed')); };
      document.head.appendChild(s);
    });
  }
  return pyodidePromise;
}
async function runSandbox(){
  const btn = document.getElementById('run-btn');
  const out = document.getElementById('code-output');
  const status = document.getElementById('run-status');
  const code = document.getElementById('code-input').value;
  btn.setAttribute('disabled','disabled');
  status.textContent = 'Загружаю Python…';
  out.textContent = '';
  try{
    const pyodide = await getPyodide();
    status.textContent = 'Выполняю…';
    let buf = '';
    pyodide.setStdout({ batched: function(s){ buf += s + String.fromCharCode(10); } });
    pyodide.setStderr({ batched: function(s){ buf += s + String.fromCharCode(10); } });
    try{
      pyodide.runPython(code);
    }catch(err){
      buf += String(err);
    }
    out.textContent = buf || '(программа ничего не вывела)';
    status.textContent = '';
  }catch(e){
    out.textContent = 'Не получилось загрузить песочницу. Проверь соединение и попробуй ещё раз.';
    status.textContent = '';
  }
  btn.removeAttribute('disabled');
}

renderNav();
applyThemeIcon();
render();

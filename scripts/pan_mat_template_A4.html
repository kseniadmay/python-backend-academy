<style>
  @page {
    size: A4 portrait;
    margin: 0;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
    background: #08080a;
    color: #f5f5f7;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px 12px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Floating Apple Glassmorphic Bar */
  .apple-header {
    position: sticky;
    top: 20px;
    z-index: 100;
    background: rgba(22, 22, 24, 0.82);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 980px;
    padding: 10px 24px;
    margin-bottom: 36px;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    display: flex;
    gap: 22px;
    align-items: center;
    max-width: 820px;
    width: 100%;
  }
  .apple-logo-badge {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #86868b;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .apple-logo-badge svg {
    fill: #f5f5f7;
    width: 14px;
    height: 14px;
  }
  .btn-print {
    background: #0071e3;
    color: #ffffff;
    border: none;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.01em;
    border-radius: 980px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 16px rgba(0, 113, 227, 0.4);
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .btn-print:hover {
    background: #0077ed;
    transform: scale(1.02);
  }
  .btn-print:active {
    background: #006edb;
    transform: scale(0.98);
  }
  .apple-desc {
    font-size: 12.5px;
    color: #a1a1a6;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }
  .apple-desc strong {
    color: #34c759;
    font-weight: 600;
  }

  /* Sheet Viewport */
  .a4-sheet {
    width: 210mm;
    height: 297mm;
    background: #ffffff;
    color: #1d1d1f;
    position: relative;
    border-radius: 6px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
    margin-bottom: 40px;
    page-break-after: always;
    overflow: hidden;
  }

  @media print {
    body {
      background: none;
      padding: 0;
    }
    .apple-header {
      display: none !important;
    }
    .a4-sheet {
      box-shadow: none;
      border-radius: 0;
      margin: 0;
      page-break-after: always;
    }
  }
</style>

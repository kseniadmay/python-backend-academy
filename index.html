<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Python Backend Academy — Загрузка...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700&display=swap">
  <script>
    (function(){
      var theme = 'dark';
      try {
        var raw = localStorage.getItem('academy_state_v1');
        if (raw) {
          var st = JSON.parse(raw);
          if (st && (st.theme === 'light' || st.theme === 'dark')) theme = st.theme;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          theme = 'light';
        }
      } catch (_e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
    try {
      var targetHash = window.location.hash || '#/';
      window.location.replace('academy.html?v=110#/'.split('#')[0] + targetHash);
    } catch(e) {
      window.location.href = 'academy.html?v=110#/';
    }
  </script>
  <style>
    :root, :root[data-theme="dark"] {
      --paper: #0d1016; --surface: rgba(22, 27, 36, 0.74); --line: rgba(255, 255, 255, 0.09);
      --dot: rgba(255, 255, 255, 0.055); --ink: #f8fafc; --ink-muted: #94a3b8;
      --cta-bg: linear-gradient(180deg, rgba(16, 185, 129, 0.28) 0%, rgba(6, 78, 59, 0.26) 100%);
      --cta-border: rgba(52, 211, 153, 0.65);
    }
    :root[data-theme="light"] {
      --paper: #faf8f5; --surface: rgba(255, 255, 255, 0.88); --line: rgba(0, 0, 0, 0.07);
      --dot: rgba(0, 0, 0, 0.045); --ink: #0f172a; --ink-muted: #475569;
      --cta-bg: linear-gradient(180deg, #7c3aed 0%, #6d28d9 100%);
      --cta-border: #5b21b6;
    }
    body {
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--paper);
      background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
    }
    .gate-card {
      text-align: center; max-width: 440px; width: 100%; padding: 28px 24px;
      border-radius: 16px; background: var(--surface); border: 1px solid var(--line);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .gate-btn {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--cta-bg); border: 1.5px solid var(--cta-border); color: #ffffff;
      padding: 12px 24px; border-radius: 10px; font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="gate-card">
    <h2 style="margin-top:0;font-size:1.35rem;font-weight:700;">Python Backend Academy</h2>
    <p style="color:var(--ink-muted);margin-bottom:22px;font-size:0.94rem;">Открывается интерактивный тренажёр с конспектами и Zen IDE.</p>
    <a href="academy.html?v=110#/" class="gate-btn">Перейти к обучению</a>
  </div>
</body>
</html>

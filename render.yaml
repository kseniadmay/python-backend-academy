services:
  - type: web
    name: python-backend-academy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SYNC_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false

<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>

<body>

        <!-- Единое доминирующее действие (Single Dominant CTA) -->
        <button class="single-dominant-cta" id="main-cta">
          <span>НАЧАТЬ (2 МИН)</span>

    import { api } from './js/api.js';
